let ovDrag = null;
let ovDragStarted = false;
let selectedCondColor = '#ef4444';

// 直接在 cell data 上查源数据（不用 getCell，因为 overview 下 activeGroupId 不是具体组）
function getGroupCell(groupId, personId, dateStr) {
  const ws = wsKey();
  if (!data.schedules[ws] || !data.schedules[ws][groupId]) return null;
  return data.schedules[ws][groupId][skey(personId, dateStr)] || null;
}

function setGroupCell(groupId, personId, dateStr, val) {
  const ws = wsKey();
  if (!data.schedules[ws]) data.schedules[ws] = {};
  if (!data.schedules[ws][groupId]) data.schedules[ws][groupId] = {};
  const key = skey(personId, dateStr);
  if (val) {
    data.schedules[ws][groupId][key] = { note: val };
  } else {
    delete data.schedules[ws][groupId][key];
  }
}

function cleanupOvDrag() {
  if (ovDrag && ovDrag.sourceEl) {
    ovDrag.sourceEl.style.opacity = '';
    ovDrag.sourceEl.style.border = '';
    ovDrag.sourceEl.style.cursor = '';
  }
  document.querySelectorAll('#overviewTable .drag-target').forEach(el => {
    el.classList.remove('drag-target'); el.style.background = ''; el.style.border = '';
  });
  ovDrag = null;
  ovDragStarted = false;
  renderAll();
}

function ovActionSwap() {
  document.getElementById('ovActionModal').style.display = 'none';
  if (!ovDrag || !ovDrag._targetPid) return;
  const tInfo = ovDrag._targetInfo;
  const tPid = ovDrag._targetPid;
  const tDate = ovDrag._targetDate;

  const targetEntry = tInfo.type === 'single' ? getGroupCell(tInfo.groupId, tPid, tDate) :
                       tInfo.type === 'resolved' ? getGroupCell(tInfo.groupId, tPid, tDate) : null;
  const targetGid = tInfo.type === 'single' ? tInfo.groupId :
                     tInfo.type === 'resolved' ? tInfo.groupId : ovDrag.groupId;
  const targetVal = targetEntry ? targetEntry.note : '';
  const changes = [];
  setGroupCell(ovDrag.groupId, tPid, tDate, ovDrag.val);
  changes.push({ personId: tPid, dateStr: tDate, oldVal: targetVal, newVal: ovDrag.val, groupId: ovDrag.groupId });
  setGroupCell(targetGid, ovDrag.personId, ovDrag.dateStr, targetVal);
  changes.push({ personId: ovDrag.personId, dateStr: ovDrag.dateStr, oldVal: ovDrag.val, newVal: targetVal, groupId: targetGid });
  changes.forEach(ch => clearResolution(ch.personId, ch.dateStr));
  pushUndo(changes);
  saveData();
  cleanupOvDrag();
  renderOverview();
}

function ovActionJoin() {
  document.getElementById('ovActionModal').style.display = 'none';
  if (!ovDrag || !ovDrag._targetPid) return;
  const tInfo = ovDrag._targetInfo;
  const tPid = ovDrag._targetPid;
  const tDate = ovDrag._targetDate;

  const targetEntry = tInfo.type === 'single' ? getGroupCell(tInfo.groupId, tPid, tDate) :
                       tInfo.type === 'resolved' ? getGroupCell(tInfo.groupId, tPid, tDate) : null;
  const targetGid = tInfo.type === 'single' ? tInfo.groupId :
                     tInfo.type === 'resolved' ? tInfo.groupId : ovDrag.groupId;
  const oldTargetVal = targetEntry ? targetEntry.note : '';
  const newTargetVal = oldTargetVal + '\n' + ovDrag.val;
  setGroupCell(targetGid, tPid, tDate, newTargetVal);
  setGroupCell(ovDrag.groupId, ovDrag.personId, ovDrag.dateStr, '');
  const changes = [
    { personId: tPid, dateStr: tDate, oldVal: oldTargetVal, newVal: newTargetVal, groupId: targetGid },
    { personId: ovDrag.personId, dateStr: ovDrag.dateStr, oldVal: ovDrag.val, newVal: '', groupId: ovDrag.groupId },
  ];
  changes.forEach(ch => clearResolution(ch.personId, ch.dateStr));
  pushUndo(changes);
  saveData();
  cleanupOvDrag();
  renderOverview();
}

function ovActionCancel() {
  document.getElementById('ovActionModal').style.display = 'none';
  cleanupOvDrag();
}

// ========================= 裁决 =========================
function openResolve(personId, dateStr, personName, dateLabel) {
  const ws = wsKey();
  const sched = data.schedules[ws] || {};
  const key = skey(personId, dateStr);
  const assigned = [];
  weekGroups().forEach(g => {
    if (sched[g.id] && sched[g.id][key]) {
      assigned.push({ groupId:g.id, groupName:g.name, note:sched[g.id][key].note });
    }
  });

  // 读取已有裁决
  const existingRes = (data.resolutions[ws] && data.resolutions[ws][key]) ? data.resolutions[ws][key] : null;
  const adopted = existingRes ? (Array.isArray(existingRes) ? existingRes : [existingRes]) : [];

  resolveTarget = { personId, dateStr };
  document.getElementById('resolveInfo').innerHTML =
    `<strong>${esc(personName)}</strong> 在 <strong>${dateLabel}</strong> 被 ${assigned.length} 个小组安排：`;
  document.getElementById('resolveOptions').innerHTML = assigned.map(g => {
    const gi = weekGroups().findIndex(gr => gr.id === g.groupId);
    const checked = adopted.includes(g.groupId);
    return `<label class="resolve-opt" style="border-left:3px solid ${COLORS[gi%COLORS.length]};display:flex;align-items:center;gap:12px;cursor:pointer;">
      <input type="checkbox" value="${g.groupId}" ${checked ? 'checked' : ''}
        style="width:18px;height:18px;accent-color:var(--primary);cursor:pointer;">
      <div><div class="resolve-gname">${esc(g.groupName)}</div><div class="resolve-note">${esc(g.note)}</div></div>
    </label>`;
  }).join('');
  // 添加确认按钮
  document.getElementById('resolveOptions').insertAdjacentHTML('beforeend',
    '<div style="text-align:right;margin-top:12px;"><button class="btn btn-p" onclick="doMultiResolve()">确认裁决</button></div>');
  document.getElementById('resolveModal').style.display = 'flex';
}

function doMultiResolve() {
  const checks = document.querySelectorAll('#resolveOptions input[type="checkbox"]:checked');
  const adopted = Array.from(checks).map(c => c.value);
  const ws = wsKey();
  if (!data.resolutions[ws]) data.resolutions[ws] = {};
  const key = skey(resolveTarget.personId, resolveTarget.dateStr);

  if (adopted.length === 0) {
    // 全部不选 = 清空裁决
    delete data.resolutions[ws][key];
    toast('已清空裁决');
  } else {
    data.resolutions[ws][key] = adopted.length === 1 ? adopted[0] : adopted;
    const names = adopted.map(gid => weekGroups().find(g => g.id === gid)?.name || '?').join('、');
    toast(`已采纳：${names}`);
  }
  saveData();
  closeResolveModal();
  switchGroup('__overview__');
}

function saveEditCondition(id) {
  const inp = document.getElementById('condEditText_' + id);
  if (!inp) return;
  const newText = inp.value.trim();
  if (!newText) { renderManageTab(); return; }
  const rule = data.conditionRules.find(r => r.id === id);
  if (!rule) return;
  if (newText !== rule.text && data.conditionRules.find(r => r.text === newText)) {
    alert('已存在相同规则'); renderManageTab(); return;
  }
  rule.text = newText;
  delete document.getElementById('conditionRulesList').dataset.editing;
  saveData(); renderManageTab();
}

// 根据条件规则获取单元格颜色（返回颜色或 null）
function getConditionColor(content) {
  if (!data.conditionRules || !content) return null;
  for (const rule of data.conditionRules) {
    if (content.indexOf(rule.text) !== -1) return rule.color;
  }
  return null;
}

function hexToRgba(hex, alpha) {
  hex = hex.replace('#', '');
  const r = parseInt(hex.substring(0, 2), 16);
  const g = parseInt(hex.substring(2, 4), 16);
  const b = parseInt(hex.substring(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

  if (editing) commitEdit();

function clearGroup() {
  if (!activeGroupId || activeGroupId === '__overview__') return;
  if (!confirm('确定清空当前小组本周所有排班？')) return;
  const ws = wsKey();
  const changes = [];
  if (data.schedules[ws] && data.schedules[ws][activeGroupId]) {
    Object.entries(data.schedules[ws][activeGroupId]).forEach(([key, entry]) => {
      const [personId, dateStr] = key.split(/_(.+)/);
      changes.push({ personId, dateStr, oldVal: entry.note, newVal: '' });
    });
    delete data.schedules[ws][activeGroupId];
  }
  if (changes.length > 0) {
    changes.forEach(ch => clearResolution(ch.personId, ch.dateStr));
    pushUndo(changes);
  }
  saveData();
  clearSelection();
  renderAll();
  toast('已清空');
}

function renderAll() {
  renderGroupTabs();
  if (weekGroups().length > 0 && !activeGroupId) activeGroupId = weekGroups()[0].id;
  const isOv = activeGroupId === '__overview__';
  document.getElementById('editPanel').style.display = isOv ? 'none' : '';
  document.getElementById('overviewPanel').style.display = isOv ? '' : 'none';
  if (isOv) renderOverview(); else renderEditTable();
}

function renderGroupTabs() {
  const ws = wsKey();
  const sched = data.schedules[ws] || {};
  const scheduleWeek = fmtFull(getMonday(new Date(Date.now() + 7*86400000)));
  const isReadonly = ws < scheduleWeek; // 只有排班周及之后才可编辑小组

  let html = '';
  if (isReadonly) {
    html += `<span style="font-size:12px;color:var(--text2);margin-right:8px;">📅 历史周（只读）</span>`;
    // 记住当前周选中的小组，切换到历史周时强制汇总表
    if (activeGroupId !== '__overview__') {
      weekActiveGroup[ws] = activeGroupId;
    }
    activeGroupId = '__overview__';
  } else {
    // 恢复到该周之前选中的小组
    if (weekActiveGroup[ws] && activeGroupId === '__overview__') {
      activeGroupId = weekActiveGroup[ws];
    }
    html += weekGroups().map((g, i) => {
      const color = COLORS[i % COLORS.length];
      const count = sched[g.id] ? Object.keys(sched[g.id]).length : 0;
      const active = activeGroupId === g.id;
      return `<button class="gtab${active?' active':''}" style="${active?`background:${color};color:#fff;`:`border-left:3px solid ${color};`}" onclick="switchGroup('${g.id}')">${esc(g.name)}<span class="cnt">${count}</span></button>`;
    }).join('');
  }
  const ovActive = activeGroupId === '__overview__';
  html += `<button class="gtab${ovActive?' active':''}" style="${ovActive?'background:#6b7280;color:#fff;':''}" onclick="switchGroup('__overview__')">📊 总览</button>`;
  if (!isReadonly) html += `<button class="gtab-add" onclick="openManageModal()" title="添加小组">+</button>`;
  document.getElementById('groupTabs').innerHTML = html;
}

// ========================= 导出 =========================
function exportExcel() {
  const dates = weekDates(currentWeek);
  const exportData = [['姓名', ...dates.map((d,i) => `${fmtDate(d)} ${DAY_NAMES[i]}`)]];
  const exportPeople = allPeople();
  exportPeople.forEach(p => {
    const row = [p.name];
    dates.forEach(d => {
      const info = getScheduleInfo(p.id, fmtFull(d));
      if (info.type === 'empty') row.push('');
      else if (info.type === 'single' || info.type === 'resolved') row.push(`${info.groupName}: ${info.note || ''}`);
      else row.push('冲突:'+info.groups.map(g=>g.groupName).join('/'));
    });
    exportData.push(row);
  });
  const wb = XLSX.utils.book_new();
  wb.SheetNames.push('排班汇总');
  wb.Sheets['排班汇总'] = XLSX.utils.aoa_to_sheet(exportData);
  XLSX.writeFile(wb, `视频排班汇总_${wsKey()}.xlsx`);
}

async function exportImage() {
  const { canvas, container } = await buildExportCanvas();
  if (!canvas) return;

  const link = document.createElement('a');
  link.download = `OM1视频制作排班表_${wsKey()}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
  document.body.removeChild(container);
  toast('图片已导出');
}

async function copyImageToClipboard() {
  const { canvas, container } = await buildExportCanvas();
  if (!canvas) return;

  try {
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    toast('图片已复制到剪切板');
  } catch(e) {
    toast('复制失败，请尝试导出图片');
  }
  document.body.removeChild(container);
}

async function buildExportCanvas() {
  // 构建干净的导出表格
  const container = document.createElement('div');
  container.style.cssText = 'position:fixed;left:-9999px;top:0;background:#fff;padding:20px 24px;font-family:sans-serif;';

  const title = document.createElement('h2');
  title.textContent = 'OM1视频制作排班表';
  title.style.cssText = 'text-align:center;margin:0 0 4px;font-size:18px;color:#333;';
  container.appendChild(title);

  const dates = weekDates(currentWeek);
  const weekStr = `${fmtDate(currentWeek)} ~ ${fmtDate(new Date(currentWeek.getTime()+6*86400000))}`;
  const subtitle = document.createElement('div');
  subtitle.textContent = weekStr;
  subtitle.style.cssText = 'text-align:center;margin:0 0 16px;font-size:12px;color:#999;';
  container.appendChild(subtitle);

  const table = document.createElement('table');
  table.style.cssText = 'border-collapse:collapse;width:100%;font-size:12px;';
  const thead = document.createElement('thead');
  const headerRow = document.createElement('tr');
  const thName = document.createElement('th');
  thName.textContent = '姓名';
  thName.style.cssText = 'border:1px solid #ccc;padding:8px;background:#f9f9f9;font-weight:600;min-width:60px;';
  headerRow.appendChild(thName);
  dates.forEach((d, i) => {
    const th = document.createElement('th');
    th.innerHTML = `${fmtDate(d)}<br><small>${DAY_NAMES[i]}</small>`;
    th.style.cssText = 'border:1px solid #ccc;padding:8px 6px;background:#f9f9f9;font-weight:600;font-size:11px;min-width:70px;';
    headerRow.appendChild(th);
  });
  thead.appendChild(headerRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  const people = weekPeople();
  let lastCat = null;
  people.forEach(p => {
    if (p._cat !== lastCat) {
      const sepRow = document.createElement('tr');
      const sepCell = document.createElement('td');
      sepCell.colSpan = 8;
      sepCell.textContent = p._cat === 'internal' ? '内部人员' : '外协人员';
      sepCell.style.cssText = 'border:1px solid #ccc;padding:6px 8px;background:#f0f0f0;font-weight:600;font-size:12px;';
      sepRow.appendChild(sepCell);
      tbody.appendChild(sepRow);
      lastCat = p._cat;
    }
    const tr = document.createElement('tr');
    const tdName = document.createElement('td');
    tdName.textContent = p.name;
    tdName.style.cssText = 'border:1px solid #ccc;padding:6px 8px;text-align:center;font-weight:500;';
    if (p._cat === 'external') {
      tdName.style.background = '#fffde7';
      tr.style.background = '#fffef5';
    }
    tr.appendChild(tdName);
    dates.forEach(d => {
      const td = document.createElement('td');
      const info = getScheduleInfo(p.id, fmtFull(d));
      let content = '';
      if (info.type === 'single' || info.type === 'resolved' || info.type === 'partial') {
        content = (info.note || '').replace(/\n/g, '<br>');
      } else if (info.type === 'conflict') {
        content = '⚠冲突';
      }
      td.innerHTML = content;
      let cellStyle = 'border:1px solid #ccc;padding:6px 4px;text-align:center;font-size:10px;word-break:break-word;';
      // 条件格式着色
      if (content && !info.type.startsWith('conflict') && !info.type.startsWith('empty')) {
        const condColor = getConditionColor(content);
        if (condColor) cellStyle += `color:#222;background:${hexToRgba(condColor,0.30)};font-weight:700;`;
      }
      td.style.cssText = cellStyle;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  container.appendChild(table);

  document.body.appendChild(container);
  await new Promise(r => setTimeout(r, 100));

  try {
    const canvas = await html2canvas(container, {
      backgroundColor: '#ffffff',
      scale: 2,
      logging: false,
    });
    return { canvas, container };
  } catch(e) {
    document.body.removeChild(container);
    toast('导出失败: ' + e.message);
    return { canvas: null, container };
  }
}

function copyToClipboard() {
  const dates = weekDates(currentWeek);
  const lines = [];
  lines.push(['姓名', ...dates.map((d,i) => `${fmtDate(d)} ${DAY_NAMES[i]}`)].join('\t'));
  const exportPeople = allPeople();
  exportPeople.forEach(p => {
    const cells = [p.name];
    dates.forEach(d => {
      const info = getScheduleInfo(p.id, fmtFull(d));
      if (info.type === 'empty') cells.push('');
      else if (info.type === 'single' || info.type === 'resolved') cells.push(info.note || '');
      else cells.push('冲突:'+info.groups.map(g=>g.groupName).join('/'));
    });
    lines.push(cells.join('\t'));
  });
  navigator.clipboard.writeText(lines.join('\n')).then(() => {
    toast('已复制到剪贴板');
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = lines.join('\n');
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('已复制到剪贴板');
  });
}

// ========================= 周选择器 =========================
function updateWeekUI() {
  const end = new Date(currentWeek); end.setDate(end.getDate()+6);
  document.getElementById('weekLabel').textContent = `${fmtDate(currentWeek)} ~ ${fmtDate(end)}`;
  // 下一周期显示「排班周」标签
  const nextMonday = fmtFull(getMonday(new Date(Date.now() + 7*86400000)));
  document.getElementById('weekBadge').style.display = (wsKey() === nextMonday) ? 'inline' : 'none';
}

function prevWeek() {
  if (editing) commitEdit();
  currentWeek = new Date(currentWeek);
  currentWeek.setDate(currentWeek.getDate() - 7);
  clearSelection();
  updateWeekUI();
  renderAll();
}

function nextWeek() {
  if (editing) commitEdit();
  currentWeek = new Date(currentWeek);
  currentWeek.setDate(currentWeek.getDate() + 7);
  clearSelection();
  updateWeekUI();
  renderAll();
}

function jumpToWeek(dateVal) {
  if (!dateVal) return;
  if (editing) commitEdit();
  currentWeek = getMonday(new Date(dateVal + 'T00:00:00'));
  clearSelection();
  updateWeekUI();
  renderAll();
}

// ========================= 启动 =========================
(async function init() {
  await loadData();
  updateWeekUI();
  if (weekGroups().length > 0) activeGroupId = weekGroups()[0].id;
  renderAll();
  updateUndoHint();
})();
</script>
