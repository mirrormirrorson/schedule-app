function pickEditColor(el, color, id) {
  const rule = data.conditionRules.find(r => r.id === id);
  if (!rule) return;
  rule.color = color;
  saveData();
  // 高亮选中的色块
  const parent = el.closest('.cond-rule');
  if (parent) {
    parent.querySelectorAll('span[data-color]').forEach(s => {
      s.style.borderColor = s.dataset.color === color ? '#333' : 'var(--border)';
    });
  }
}

function saveEditCondition(id) {
  const inp = document.getElementById('condEditText_' + id);
  if (!inp) return;
  const newText = inp.value.trim();
  if (!newText) { renderManageTab(); return; }
  const rule = data.conditionRules.find(r => r.id === id);
  if (!rule) return;
  if (newText !== rule.text && data.conditionRules.find(r => r.text === newText)) {
    alert('已存在相同规则'); renderManageTab(); return;
  }
  rule.text = newText;
  delete document.getElementById('conditionRulesList').dataset.editing;
  saveData(); renderManageTab();
}

function editConditionRule(id) {
  startEditCondition(id);
}

// 根据条件规则获取单元格颜色（返回颜色或 null）
function getConditionColor(content) {
  if (!data.conditionRules || !content) return null;
  for (const rule of data.conditionRules) {
    if (content.indexOf(rule.text) !== -1) return rule.color;
  }
  return null;
}

function hexToRgba(hex, alpha) {
  hex = hex.replace('#', '');
  const r = parseInt(hex.substring(0, 2), 16);
  const g = parseInt(hex.substring(2, 4), 16);
  const b = parseInt(hex.substring(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function switchGroup(id) {
  if (editing) commitEdit();

  renderAll();

function clearGroup() {
  if (!activeGroupId || activeGroupId === '__overview__') return;
  if (!confirm('确定清空当前小组本周所有排班？')) return;
  const ws = wsKey();
  const changes = [];
  if (data.schedules[ws] && data.schedules[ws][activeGroupId]) {
    Object.entries(data.schedules[ws][activeGroupId]).forEach(([key, entry]) => {
      const [personId, dateStr] = key.split(/_(.+)/);
      changes.push({ personId, dateStr, oldVal: entry, newVal: [] });
    });
    delete data.schedules[ws][activeGroupId];
  }
  if (changes.length > 0) {
        pushUndo(changes);
  }
  saveData();
  clearSelection();
  renderAll();
  toast('已清空');
}

function renderAll() {
  renderGroupTabs();
  if (weekGroups().length > 0 && !activeGroupId) activeGroupId = weekGroups()[0].id;
  const isOv = activeGroupId === '__overview__';
  document.getElementById('editPanel').style.display = isOv ? 'none' : '';
  document.getElementById('overviewPanel').style.display = isOv ? '' : 'none';
  if (isOv) renderOverview(); else renderEditTable();
}

function renderGroupTabs() {
  const ws = wsKey();
  const sched = data.schedules[ws] || {};
  const scheduleWeek = fmtFull(getMonday(new Date(Date.now() + 7*86400000)));
  const isReadonly = ws < scheduleWeek; // 只有排班周及之后才可编辑小组

  let html = '';
  if (isReadonly) {
    html += `<span style="font-size:12px;color:var(--text2);margin-right:8px;">📅 历史周（只读）</span>`;
    // 记住当前周选中的小组，切换到历史周时强制汇总表
    if (activeGroupId !== '__overview__') {
      weekActiveGroup[ws] = activeGroupId;
    }
    activeGroupId = '__overview__';
  } else {
    // 恢复到该周之前选中的小组
    if (weekActiveGroup[ws] && activeGroupId === '__overview__') {
      activeGroupId = weekActiveGroup[ws];
    }
    html += weekGroups().map((g, i) => {
      const color = (g.color || COLORS[i % COLORS.length]);
      const count = sched[g.id] ? Object.keys(sched[g.id]).length : 0;
      const active = activeGroupId === g.id;
      return `<button class="gtab${active?' active':''}" style="${active?`background:${color};color:#fff;`:`border-left:3px solid ${color};`}" onclick="switchGroup('${g.id}')">${esc(g.name)}<span class="cnt">${count}</span></button>`;
    }).join('');
  }
  const ovActive = activeGroupId === '__overview__';
  html += `<button class="gtab${ovActive?' active':''}" style="${ovActive?'background:#6b7280;color:#fff;':''}" onclick="switchGroup('__overview__')">📊 总览</button>`;
  if (!isReadonly) html += `<button class="gtab-add" onclick="openManageModal()" title="添加小组">+</button>`;
  document.getElementById('groupTabs').innerHTML = html;
}

async function buildExportCanvas() {

    th.style.cssText = 'border:1px solid #ccc;padding:8px 6px;background:#f9f9f9;font-weight:600;font-size:11px;min-width:70px;';
    headerRow.appendChild(th);
  });
  thead.appendChild(headerRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  const people = weekPeople();
  let lastCat = null;
  people.forEach(p => {
    if (p._cat !== lastCat) {
      const sepRow = document.createElement('tr');
      const sepCell = document.createElement('td');
      sepCell.colSpan = 8;
      sepCell.textContent = p._cat === 'internal' ? '内部人员' : '外协人员';
      sepCell.style.cssText = 'border:1px solid #ccc;padding:6px 8px;background:#f0f0f0;font-weight:600;font-size:12px;';
      sepRow.appendChild(sepCell);
      tbody.appendChild(sepRow);
      lastCat = p._cat;
    }
    const tr = document.createElement('tr');
    const tdName = document.createElement('td');
    tdName.textContent = p.name;
    tdName.style.cssText = 'border:1px solid #ccc;padding:6px 8px;text-align:center;font-weight:500;';
    if (p._cat === 'external') {
      tdName.style.background = '#fffde7';
      tr.style.background = '#fffef5';
    }
    tr.appendChild(tdName);
    dates.forEach(d => {
      const td = document.createElement('td');
      const blocks = getScheduleInfo(p.id, fmtFull(d));
      const minH = Math.max(70, blocks.length * 35);
      td.style.cssText = `border:1px solid #ccc;padding:0;text-align:center;vertical-align:top;font-size:10px;word-break:break-word;position:relative;height:${minH}px;`;
      if (blocks.length > 0) {
        const wrapper = document.createElement('div');
        wrapper.style.cssText = 'display:flex;flex-direction:column;align-items:stretch;justify-content:center;height:100%;box-sizing:border-box;';
        blocks.forEach(b => {
          const div = document.createElement('div');
          div.textContent = b.note || '';
          let ds = 'flex:1 1 auto;display:flex;align-items:center;justify-content:center;text-align:center;padding:3px 4px;border-radius:4px;line-height:1.4;white-space:pre-wrap;word-break:break-word;min-height:0;';
          const condColor = getConditionColor(b.note);
          if (condColor) {

          }
          div.style.cssText = ds;
          wrapper.appendChild(div);
        });
        td.appendChild(wrapper);
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  container.appendChild(table);

  document.body.appendChild(container);
  await new Promise(r => setTimeout(r, 100));

  try {
    const canvas = await html2canvas(container, {
      backgroundColor: '#ffffff',
      scale: 2,
      logging: false,
    });
    return { canvas, container };
  } catch(e) {
    document.body.removeChild(container);
    toast('导出失败: ' + e.message);
    return { canvas: null, container };
  }
}

function copyToClipboard() {

function initCellTooltip() {
  const tooltip = document.createElement('div');
  tooltip.id = 'cellTooltip';
  tooltip.className = 'cell-tooltip';
  document.body.appendChild(tooltip);

  const editTable = document.getElementById('editTable');
  if (!editTable) return;

  function positionTooltip(e) {
    const pad = 12;
    let left = e.clientX + pad;
    let top = e.clientY + pad;
    const rect = tooltip.getBoundingClientRect();
    if (left + rect.width > window.innerWidth - pad) left = e.clientX - rect.width - pad;
    if (top + rect.height > window.innerHeight - pad) top = e.clientY - rect.height - pad;
    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
  }

  editTable.addEventListener('mouseover', e => {
    const cell = e.target.closest('.cell');
    if (!cell || cell.classList.contains('editing')) { tooltip.style.display = 'none'; return; }
    const pid = cell.dataset.pid;
    const ds = cell.dataset.date;
    if (!pid || !ds) { tooltip.style.display = 'none'; return; }
    const conflicts = getCrossGroupBlocks(pid, ds);
    if (conflicts.length === 0) { tooltip.style.display = 'none'; return; }
    const items = conflicts.map(b => {
      const note = esc(b.note || '').replace(/\n/g, '<br>');
      return `<div class="tip-item"><span class="tip-group">${esc(b.groupName)}</span><div class="tip-content">${note}</div></div>`;
    }).join('');
    tooltip.innerHTML = `<div class="tip-title">⚠ 其它小组已在此处排期</div>${items}<div class="tip-message">已在此处填写排期，请大家先自行协调安排，如解决不了填入后等待排班负责人协调~</div>`;
    tooltip.style.display = 'block';
    positionTooltip(e);
  });

  editTable.addEventListener('mousemove', e => {
    if (tooltip.style.display === 'block') positionTooltip(e);
  });

  editTable.addEventListener('mouseout', e => {
    if (e.target.closest('.cell')) tooltip.style.display = 'none';
  });
}

// ========================= 启动 =========================
// ========================= 3.0: 用户身份 & 审计历史 =========================
let currentUser = null;
const USER_KEY = 'schedule_user_v1';

function userName() { return (currentUser && currentUser.name) || '匿名'; }

function appendHistory(entries) {
  if (!entries || !entries.length) return;
  try {
    fetch(`${API_BASE}/api/history/append`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(entries)
    }).catch(() => {});
  } catch (e) {}
}

function resolvePersonName(pid) {
  if (!pid) return '';
  let p = (data.internalPeople || []).find(x => x.id === pid) || (data.externalPeople || []).find(x => x.id === pid);
  if (!p && data.weekPeople) {
    for (const arr of Object.values(data.weekPeople)) {
      const f = arr.find(x => x.id === pid);
      if (f) { p = f; break; }
    }
  }
  return p ? p.name : (pid || '');
}

function resolveGroupName(gid) {
  if (!gid || gid === '__overview__') return '总览';
  const g = (data.groups || []).find(x => x.id === gid) || (weekGroups().find(x => x.id === gid));
  return g ? g.name : '未知组';
}

function summarizeEntries(entries) {
  if (!entries || !entries.length) return '';
  return entries.map(e => {
    if (!e) return '';
    if (e.note != null) return e.note;
    if (e.blockData) return '[多块]';
    return '';
  }).filter(Boolean).join(' / ');
}

function weekdayName(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return '';
  return ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()];
}

function logChanges(changes, opId, opMeta) {
  if (!changes || !changes.length) return;
  const week = wsKey();
  let entries;
  if (opMeta && opMeta.type === 'move') {
    // 拖拽 = 一次移动，合并为单条记录
    const fromLabel = `${resolvePersonName(opMeta.fromPerson)}·${weekdayName(opMeta.fromDate)}`;
    const toLabel = `${resolvePersonName(opMeta.toPerson)}·${weekdayName(opMeta.toDate)}`;
    entries = [{
      user: userName(),
      ts: new Date().toISOString(),
      week,
      group: resolveGroupName(opMeta.groupId),
      person: '', date: '', weekday: '',
      action: 'move',
      content: opMeta.content || '',
      fromLabel, toLabel,
      opId
    }];
  } else {
    entries = changes.map(ch => {
      const oldV = ch.oldVal || [], newV = ch.newVal || [];
      const had = oldV.length > 0, has = newV.length > 0;
      let action = 'modify';
      if (!had && has) action = 'add';
      else if (had && !has) action = 'delete';
      const gid = ch.groupId || activeGroupId;
      const dateStr = ch.dateStr || '';
      return {
        user: userName(),
        ts: new Date().toISOString(),
        week,
        group: resolveGroupName(gid),
        person: resolvePersonName(ch.personId),
        date: dateStr,
        weekday: weekdayName(dateStr),
        action,
        content: (action === 'delete') ? summarizeEntries(oldV) : summarizeEntries(newV),
        detail: { old: summarizeEntries(oldV), new: summarizeEntries(newV) },
        opId
      };
    });
  }
  appendHistory(entries);
}

function logPersonAction(action, personName, group) {
  appendHistory([{
    user: userName(), ts: new Date().toISOString(), week: wsKey(),
    group: group || '人员管理', person: personName, action, content: personName,
    date: '', weekday: ''
  }]);
}

function outsideCloseUserMenu(e) {
  const m = document.getElementById('userMenu');
  if (m && !m.contains(e.target) && e.target.id !== 'userGreeting') closeUserMenu();
}
function closeUserMenu() {
  const m = document.getElementById('userMenu');
  if (m) m.remove();
  document.removeEventListener('click', outsideCloseUserMenu);
}

function showIdentityModal(forced = false) {
  if (document.getElementById('identityModal')) return;
  const overlay = document.createElement('div');
  overlay.id = 'identityModal';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:700;' + (forced ? 'cursor:default;' : '');
  overlay.innerHTML = `
    <div class="id-card">
      <div class="id-title">👋 欢迎使用视频排班</div>
      <div class="id-sub">首次使用，请填写你的真实姓名，用于记录每一次排班修改（换设备输入同名将自动登录原身份）。</div>
      <input id="identityNameInput" placeholder="请输入真实姓名" />
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px;">
        <button class="btn btn-p" id="identityConfirm">确定</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const inp = overlay.querySelector('#identityNameInput');
  inp.focus();
  const doConfirm = async () => {
    const name = (inp.value || '').trim();
    if (!name) { inp.style.borderColor = '#ef4444'; return; }
    try {
      const u = await identifyUser(name);
      currentUser = u;
      localStorage.setItem(USER_KEY, name);
      renderGreeting();
      overlay.remove();
    } catch (e) { alert('提交失败，请重试'); }
  };
  overlay.querySelector('#identityConfirm').addEventListener('click', doConfirm);
  inp.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); doConfirm(); }
    if (e.key === 'Escape') { e.preventDefault(); if (!forced) overlay.remove(); }
  });
  // 强制模式下禁止点击遮罩关闭（避免匿名账户，无法追溯谁改过排班）
  if (!forced) {
    overlay.addEventListener('mousedown', e => { if (e.target === overlay) overlay.remove(); });
  }
}

async function initIdentity() {
  const saved = localStorage.getItem(USER_KEY);
  if (saved) {
    try {
      const u = await identifyUser(saved);
      if (u) { currentUser = u; renderGreeting(); return; }
    } catch (e) {}
  }
  showIdentityModal(true);
}

// ---- 修改记录抽屉 ----
const ACTION_LABEL = { add: '新增', modify: '修改', delete: '删除', move: '移动', addPerson: '新增人员', renamePerson: '改名', removePerson: '删除人员', removeFromWeek: '移除本周' };

function openHistoryDrawer() {
  const sel = document.getElementById('historyGroupFilter');
  if (sel && sel.options.length <= 1) {
    const baseOpts = '<option value="">全部组</option><option value="总览">总览</option>';
    const gOpts = (data.groups || []).map(g => `<option value="${esc(g.name)}">${esc(g.name)}</option>`).join('');
    const wgOpts = (weekGroups() || []).filter(wg => !(data.groups || []).find(g => g.id === wg.id))
      .map(g => `<option value="${esc(g.name)}">${esc(g.name)}</option>`).join('');
    sel.innerHTML = baseOpts + gOpts + wgOpts;
  }
  document.getElementById('historyOverlay').classList.add('open');
  document.getElementById('historyDrawer').classList.add('open');
  loadAllHistory();
}

function closeHistoryDrawer() {
  document.getElementById('historyOverlay').classList.remove('open');
  document.getElementById('historyDrawer').classList.remove('open');
}

// 周标注：本周 / 排班周（=当前编辑周）始终标注，未来周仅在有数据时出现在筛选里
function weekLabelOf(wk) {
  if (!wk) return '—';
  const thisWeekKey = fmtFull(getMonday(new Date()));
  const scheduleWeekKey = fmtFull(getMonday(new Date(Date.now() + 7 * 86400000)));
  const start = new Date(wk + 'T00:00:00');
  const end = new Date(start.getTime() + 6 * 86400000);
  const range = `${fmtDate(start)}~${fmtDate(end)}`;
  if (wk === thisWeekKey && wk === scheduleWeekKey) return '本周/排班周 ' + range;
  if (wk === thisWeekKey) return '本周 ' + range;
  if (wk === scheduleWeekKey) return '排班周 ' + range;
  return range;
}

let allHistory = [];

async function loadAllHistory() {
  const list = document.getElementById('historyList');
  if (!list) return;
  list.innerHTML = '<div class="hd-empty">加载中…</div>';
  try {
    const res = await fetch(`${API_BASE}/api/history?limit=8000`);
    if (!res.ok) throw new Error('fail');
    const r = await res.json();
    allHistory = r.history || [];
    buildWeekFilter();
    renderHistoryList();
  } catch (e) {
    list.innerHTML = '<div class="hd-empty">加载失败</div>';
  }
}

function buildWeekFilter() {
  const sel = document.getElementById('historyWeekFilter');
  if (!sel) return;
  const thisWeekKey = fmtFull(getMonday(new Date()));
  const scheduleWeekKey = fmtFull(getMonday(new Date(Date.now() + 7 * 86400000)));
  const weeks = new Set();
  weeks.add(thisWeekKey);
  weeks.add(scheduleWeekKey);
  (allHistory || []).forEach(h => { if (h.week) weeks.add(h.week); });
  const opts = ['<option value="">全部周</option>'];
  [...weeks].sort().forEach(wk => {
    opts.push(`<option value="${wk}">${weekLabelOf(wk)}</option>`);
  });
  sel.innerHTML = opts.join('');
}

function renderHistoryList() {
  const list = document.getElementById('historyList');
  if (!list) return;
  const g = document.getElementById('historyGroupFilter').value;
  const wk = document.getElementById('historyWeekFilter').value;
  const q = document.getElementById('historySearch').value.trim().toLowerCase();
  let h = allHistory || [];
  if (g) h = h.filter(x => (x.group || '') === g);
  if (wk) h = h.filter(x => (x.week || '') === wk);
  if (q) h = h.filter(x => ((x.user || '') + (x.person || '') + (x.content || '') + (x.week || '')).toLowerCase().includes(q));
  h = h.slice().sort((a, b) => new Date(b.ts) - new Date(a.ts));
  if (!h.length) { list.innerHTML = '<div class="hd-empty">暂无修改记录</div>'; return; }
  list.innerHTML = h.map(e => {
    const t = new Date(e.ts);
    const time = isNaN(t) ? e.ts : t.toLocaleString('zh-CN', { hour12: false });
    const label = ACTION_LABEL[e.action] || e.action;
    const cls = ACTION_LABEL[e.action] ? e.action : 'modify';
    let bodyHtml;
    if (e.action === 'move') {
      bodyHtml = `<span class="hd-user">${esc(e.user || '匿名')}</span> <span class="hd-tag move">移动</span><span class="hd-content"> 将「${esc(e.content || '')}」从 ${esc(e.fromLabel || '')} 移动到 ${esc(e.toLabel || '')}</span>`;
    } else if (e.action === 'modify') {
      const old = (e.detail && e.detail.old) || '';
      const nw = (e.detail && e.detail.new) || '';
      bodyHtml = `<span class="hd-user">${esc(e.user || '匿名')}</span> <span class="hd-tag modify">修改</span><span class="hd-content"> 将「${esc(old)}」修改成「${esc(nw)}」</span>`;
    } else if (e.action === 'delete') {
      bodyHtml = `<span class="hd-user">${esc(e.user || '匿名')}</span> <span class="hd-tag delete">删除</span><span class="hd-content"> 了「${esc(e.content || '')}」</span>`;
    } else {
      const content = e.content ? ` 了「${esc(e.content)}」` : '';
      bodyHtml = `<span class="hd-user">${esc(e.user || '匿名')}</span> <span class="hd-tag ${cls}">${label}</span><span class="hd-content">${content}</span>`;
    }
    const where = (e.person || e.group) ? `📍 ${esc(e.person || e.group || '')}${e.weekday ? (' 的' + esc(e.weekday)) : ''}` : '';
    return `<div class="hd-item">
      <div class="hd-meta">${time} · ${weekLabelOf(e.week)} · ${esc(e.group || '')}</div>
      <div class="hd-body">${bodyHtml}</div>
      ${where ? `<div class="hd-where">${where}</div>` : ''}
    </div>`;
  }).join('');
}

(async function init() {
  await loadData();
  ensureGroupColors();
  updateWeekUI();
  if (weekGroups().length > 0) activeGroupId = weekGroups()[0].id;
  renderAll();
  initCellTooltip();
  updateUndoHint();
  initIdentity();
})();
</script>
<div id="historyOverlay" class="hd-overlay" onclick="if(event.target===this)closeHistoryDrawer()"></div>
<aside id="historyDrawer" class="hd-drawer">
  <div class="hd-head"><span>🕘 修改记录</span><button class="btn" onclick="closeHistoryDrawer()">✕</button></div>
  <div class="hd-filters">
    <select id="historyGroupFilter" onchange="renderHistoryList()"><option value="">全部组</option></select>
    <select id="historyWeekFilter" onchange="renderHistoryList()"><option value="">全部周</option></select>
    <input id="historySearch" placeholder="搜索姓名/内容" oninput="renderHistoryList()">
  </div>
  <div id="historyList" class="hd-list"></div>
</aside>
<script>
/* ===== 程序化高级背景：主题化实时渲染（暗色=深空星云，浅色=柔和极光） ===== */
(function () {
  var cv = document.getElementById('bgCanvas');
  if (!cv || !cv.getContext) return;
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, dpr = 1, raf = null, running = false, blobs = [];
  var palette = { isDark: false, prim: '#38bdf8', bgc: '#070b16' };

  function hexToRgb(hex) {
    hex = (hex || '').trim();
    if (hex[0] !== '#') {
      var m = hex.match(/\d+/g);
      if (m && m.length >= 3) return [+m[0], +m[1], +m[2]];
      return [56, 189, 248];
    }
    var h = hex.slice(1);
    if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgba(hex, a) {
    var c = hexToRgb(hex);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }

  function readPalette() {
    var cs = getComputedStyle(document.documentElement);
    var theme = document.documentElement.getAttribute('data-theme') || 'pink';
    palette.isDark = (theme === 'dark');
    palette.prim = (cs.getPropertyValue('--primary').trim()) || '#38bdf8';
    palette.bgc = (cs.getPropertyValue('--bg').trim()) || '#070b16';
  }

  function buildBlobs() {
    var cols = palette.isDark
      ? [palette.prim, '#6366f1', '#22d3ee', palette.prim, '#8b5cf6']
      : [palette.prim, '#a5b4fc', '#f9a8d4', '#6ee7b7', '#fcd34d'];
    blobs = cols.map(function (c) {
      return {
        color: c,
        bx: Math.random(), by: Math.random(),
        r: 0.30 + Math.random() * 0.22,
        sx: (Math.random() * 2 - 1) * 0.00005,
        sy: (Math.random() * 2 - 1) * 0.00005,
        ph: Math.random() * Math.PI * 2,
        sp: 0.0005 + Math.random() * 0.0006,
        maxA: palette.isDark ? 0.22 : 0.16
      };
    });
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W * dpr); cv.height = Math.floor(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function draw(now) {
    if (!running) return;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = palette.bgc;
    ctx.fillRect(0, 0, W, H);
    var R = Math.max(W, H);
    ctx.globalCompositeOperation = palette.isDark ? 'lighter' : 'source-over';
    for (var i = 0; i < blobs.length; i++) {
      var b = blobs[i];
      b.bx += b.sx * 16; b.by += b.sy * 16;
      if (b.bx < -0.25 || b.bx > 1.25) b.sx *= -1;
      if (b.by < -0.25 || b.by > 1.25) b.sy *= -1;
      var pulse = 0.65 + 0.35 * Math.sin(now * b.sp + b.ph);
      var cx = b.bx * W, cy = b.by * H, rad = b.r * R * pulse;
      var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
      g.addColorStop(0, rgba(b.color, b.maxA));
      g.addColorStop(1, rgba(b.color, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    if (palette.isDark) {
      ctx.fillStyle = 'rgba(165,185,235,0.055)';
      var step = 40, off = (now * 0.002) % step;
      for (var x = off; x < W; x += step) {
        for (var y = 0; y < H; y += step) {
          ctx.beginPath(); ctx.arc(x, y, 1, 0, Math.PI * 2); ctx.fill();
        }
      }
    }
    raf = requestAnimationFrame(draw);
  }

  function start() {
    readPalette(); resize(); buildBlobs();
    if (!running) { running = true; raf = requestAnimationFrame(draw); }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();

  // 主题切换时同步配色与光斑
  if (window.MutationObserver) {
    new MutationObserver(function () { readPalette(); buildBlobs(); })
      .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  }

  // 视口变化：防抖重算尺寸
  var rt;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () { resize(); buildBlobs(); }, 150);
  });

  // 标签页隐藏时暂停渲染，省电省 CPU
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { running = false; if (raf) cancelAnimationFrame(raf); }
    else if (!running) { running = true; raf = requestAnimationFrame(draw); }
  });
})();
</script>
